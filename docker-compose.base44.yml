services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "yarn install --frozen-lockfile && yarn start --host 0.0.0.0"
    environment:
      - DOCKER_DEV=1
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - VITE_APP_ENABLE_ESLINT=false
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3001"
    volumes:
      - .:/app
    restart: unless-stopped
