services:
  excalidraw:
    image: node:22
    working_dir: /app
    command: >
      bash -c "
        corepack enable &&
        yarn install --frozen-lockfile --network-timeout 600000 &&
        cd excalidraw-app &&
        npx vite --host 0.0.0.0 --port 3000 --open false
      "
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=3000
      - VITE_APP_ENABLE_ESLINT=false
      - VITE_APP_ENABLE_PWA=false
      - BROWSER=none
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: on-failure

volumes:
  node_modules:
