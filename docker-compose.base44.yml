services:
  excalidraw:
    image: node:22
    working_dir: /app
    command: >
      sh -c "
        corepack enable &&
        yarn install --frozen-lockfile --network-timeout 600000 &&
        yarn start
      "
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=3000
      - VITE_APP_ENABLE_ESLINT=false
      - VITE_APP_ENABLE_PWA=false
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: on-failure

volumes:
  node_modules:
