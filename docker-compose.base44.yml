services:
  excalidraw:
    image: node:22
    working_dir: /app
    command: >
      bash -c "
        corepack enable &&
        yarn install --frozen-lockfile --network-timeout 600000 &&
        cd excalidraw-app &&
        yarn vite --host 0.0.0.0 --port 3000
      "
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nm_excalidraw_app:/app/excalidraw-app/node_modules
    environment:
      - VITE_APP_PORT=3000
      - NODE_ENV=development
      - DOCKER_CONTAINER=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env

volumes:
  node_modules:
  nm_excalidraw_app:
