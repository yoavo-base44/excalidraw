services:
  web:
    image: node:22
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "yarn install --frozen-lockfile --non-interactive && exec yarn start --host 0.0.0.0",
      ]
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3001"
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  node_modules:
