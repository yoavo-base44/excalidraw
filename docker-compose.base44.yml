services:
  web:
    image: node:22
    working_dir: /app
    command: >
      bash -lc "yarn install --frozen-lockfile &&
      yarn start --host 0.0.0.0 --port 3001"
    environment:
      - NODE_ENV=development
      - VITE_APP_PORT=3001
      - CHOKIDAR_USEPOLLING=true
      - BROWSER=none
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.${BASE44_SANDBOX_HOST_DOMAIN}
    ports:
      - "3000:3001"
    volumes:
      - ./:/app
      - node_modules_root:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules_root:
