services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "yarn install --frozen-lockfile && yarn start --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3001"
    volumes:
      - ./:/app:delegated
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
